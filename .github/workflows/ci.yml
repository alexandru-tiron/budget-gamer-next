name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI has no database or secrets, and doesn't need Puppeteer's Chrome download
      SKIP_ENV_VALIDATION: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budget_gamer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/budget_gamer_test
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Database integration tests
        run: npm run test:db
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway values for the CI stack only
      POSTGRES_PASSWORD: ci-postgres-password
      CRON_SECRET: ci-cron-secret
      REDDIT_AUTH_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start the production stack
        # -f skips compose.override.yaml, so this is the self-hosting setup
        run: docker compose -f compose.yaml up -d --build
      - name: Wait for the app and database
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 5
          done
          echo "The app never became ready" >&2
          exit 1
      - name: Smoke test
        run: |
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/timed
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/cron/daily)
          test "$status" = "401"
          docker compose -f compose.yaml ps scheduler --format '{{.State}}' | grep -q running
      - name: Show logs
        if: failure()
        run: docker compose -f compose.yaml logs
      - name: Stop the stack
        if: always()
        # Removes the throwaway CI database volume
        run: docker compose -f compose.yaml down -v
