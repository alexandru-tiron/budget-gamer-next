# Call the app's cron endpoints on the same schedule as vercel.json (UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: budget-gamer-cron-daily
  labels:
    app.kubernetes.io/name: budget-gamer
    app.kubernetes.io/component: scheduler
spec:
  # Daily at midnight: Reddit giveaways, Humble Choice and PS Plus
  schedule: "0 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: budget-gamer
            app.kubernetes.io/component: scheduler
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: budget-gamer
                      key: CRON_SECRET
              args:
                - --fail-with-body
                - --silent
                - --show-error
                - --max-time
                - "900"
                - --header
                - "Authorization: Bearer $(CRON_SECRET)"
                - http://budget-gamer/api/cron/daily
              resources:
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
---
