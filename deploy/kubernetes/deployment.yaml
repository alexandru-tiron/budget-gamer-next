apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-gamer
  labels:
    app.kubernetes.io/name: budget-gamer
    app.kubernetes.io/component: web
spec:
  # Docker builds render pages per request, so replicas never serve stale cached pages
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: budget-gamer
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: budget-gamer
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/alexandru-tiron/budget-gamer
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LOG_LEVEL
              value: info
          # DATABASE_URL, CRON_SECRET and REDDIT_AUTH_TOKEN (see secret.example.yaml)
          envFrom:
            - secretRef:
                name: budget-gamer
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Headless Chromium needs room while a scraper runs
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
