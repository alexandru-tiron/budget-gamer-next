# Applies the migrations in drizzle/. Jobs can't be changed once created, so delete the finished
# one before applying a new release:
#   kubectl -n budget-gamer delete job budget-gamer-migrate --ignore-not-found
apiVersion: batch/v1
kind: Job
metadata:
  name: budget-gamer-migrate
  labels:
    app.kubernetes.io/name: budget-gamer
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: budget-gamer
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/alexandru-tiron/budget-gamer-migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: budget-gamer
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
