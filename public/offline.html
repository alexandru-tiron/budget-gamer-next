<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141314" />
    <title>Offline · Budget Gamer</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141314;
        color: #d1d5db;
        font-family:
          Roboto,
          ui-sans-serif,
          system-ui,
          sans-serif;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      main {
        max-width: 24rem;
      }
      img {
        width: 100%;
        max-width: 16rem;
      }
      h1 {
        color: #8f73e8;
        font-size: 1.25rem;
        font-weight: 500;
        margin: 1rem 0 0.5rem;
      }
      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.5rem 1.5rem;
        color: #fff;
        font: inherit;
        background: linear-gradient(to bottom right, #7c3196, #694ace);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #8f73e8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/images/draws/maintenance_drawable.imageset/maintenance_drawable_dark.svg"
        alt=""
      />
      <h1>You're offline</h1>
      <p>
        This page isn't saved on your device yet. Pages you've already visited
        still work offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
